<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="csrf-token" content="{{ csrf_token }}">
    <title>Document</title>
</head>
<body>
    <h3>Hello {{ request.user.email }}</h3>

    <button type="button" onclick="logOutUser()">Logout</button>

    <button><a href="{% url 'user_authentication:business_profile'%}">Edit profile</a></button>
    <button><a href="{% url 'user_business:contact_form'%}">Add Contact</a></button>
    <button><a href="{% url 'user_business:schedule_message_form'%}">Schedule Message</a></button>
    <button><a href="{% url 'user_business:template_form'%}">Message Templates</a></button>
    <button id="send">Send Catalog</button>

    <input type="text" placeholder="Enter recipient's phone number" id="phone_number">
    <input type="text" placeholder="Enter your message" id="message">
    <input type="file" id="image" name="image" accept="image/*">
    
    <button id="send_whatsapp">Send WhatsApp Message</button>
    <input type="text" placeholder="Enter your ctatalog recipient" id="catalog-message">

    <button onclick="launchWhatsAppSignup()">Connect WhatsApp Business</button>


    <!-- product_form.html -->
    <div class="container mt-4">
        <h2>Add New Product</h2>
        
        <form id="productForm" enctype="multipart/form-data">
            <!-- Basic Product Details -->
            <div class="mb-3">
            <label for="name" class="form-label">Product Name *</label>
            <input type="text" class="form-control" id="name" name="name" required>
            </div>

            <div class="mb-3">
            <label for="seller" class="form-label">Seller / Vendor / Brand Name</label>
            <input type="text" class="form-control" id="seller" name="seller" placeholder="e.g. Winimarket or Vendor Name">
            </div>

            <div class="mb-3">
            <label for="description" class="form-label">Description</label>
            <textarea class="form-control" id="description" name="description" rows="3"></textarea>
            </div>

            <!-- Pricing & Currency -->
            <div class="row">
            <div class="col-md-8 mb-3">
                <label for="price" class="form-label">Price (GHS) *</label>
                <input type="number" step="0.01" min="0.01" class="form-control" id="price" name="price" required>
            </div>
            <div class="col-md-4 mb-3">
                <label for="currency" class="form-label">Currency</label>
                <input type="text" class="form-control" id="currency" name="currency" value="GHS" readonly>
            </div>
            </div>

            <!-- Status & Condition -->
            <div class="row">
            <div class="col-md-6 mb-3">
                <label for="availability" class="form-label">Availability</label>
                <select class="form-select" id="availability" name="availability">
                <option value="in stock" selected>In Stock</option>
                <option value="out of stock">Out of Stock</option>
                </select>
            </div>
            <div class="col-md-6 mb-3">
                <label for="condition" class="form-label">Condition</label>
                <select class="form-select" id="condition" name="condition">
                <option value="new" selected>New</option>
                <option value="refurbished">Refurbished</option>
                <option value="used">Used</option>
                </select>
            </div>
            </div>

            <!-- Images -->
            <div class="mb-3">
                <label for="image-" class="form-label">Primary Product Image *</label>
                <input type="file" class="form-control" id="image-" name="image" accept="image/*" required>
            </div>

            <div class="mb-3">
            <label for="additional_images" class="form-label">Additional Gallery Images</label>
            <input type="file" class="form-control" id="additional_images" name="additional_images" accept="image/*" multiple>
            </div>

            <!-- Submit Button -->
            <button type="submit" id="submitBtn" class="btn btn-primary">
            <span id="btnText">Save & Upload Product</span>
            <span id="btnSpinner" class="spinner-border spinner-border-sm d-none" role="status" aria-hidden="true"></span>
            </button>
        </form>

        <!-- Status / Response Messages -->
        <div id="alertMessage" class="alert mt-3 d-none" role="alert"></div>
    </div>


    <!-- Load Meta JS SDK -->
    <script async defer crossorigin="anonymous" src="https://connect.facebook.net/en_US/sdk.js"></script>

    <script>
        const send = document.getElementById('send').addEventListener('click', async (e)=> {
            e.preventDefault()

            await sendCatalog()
        })

        async function sendCatalog(){
            try{

                const csrfMeta = document.querySelector('meta[name="csrf-token"]');
                const csrfToken = csrfMeta ? csrfMeta.getAttribute('content') : '';
                const recipient = document.getElementById('catalog-message').value

                const response = await fetch('/account/send_catalog/', {
                    method: 'POST',
                    headers: {'X-CSRFToken': csrfToken, 'Content-Type': 'application/json'},
                    body: JSON.stringify({recipient_phones: recipient})
                })

                const data = await response.json()

                if (!response.ok){
                    console.log(data.results)
                }

                console.log(`Catalog sent successfully: ${data.status}`)

            } catch(error){
                console.error(`Something went wrong ${error}`)
            }
        }

        window.fbAsyncInit = function() {
            FB.init({
            appId      : '1974486773200732',
            cookie     : true,
            xfbml      : true,
            version    : 'v21.0'
            });
        };

        // Ensure you have a global listener setup outside this function to capture session IDs from Meta
        let capturedWabaId = null;

        window.addEventListener('message', (event) => {
            if (event.origin !== 'https://www.facebook.com' && event.origin !== 'https://web.facebook.com') return;
            try {
                const data = JSON.parse(event.data);
                if (data.type === 'WA_EMBEDDED_SIGNUP' && data.event === 'FINISH') {
                    // Capture waba_id returned in postMessage
                    capturedWabaId = data.data?.waba_id;
                }
            } catch (e) {
                // Ignore non-JSON messages
            }
        });

        function launchWhatsAppSignup() {
            const appId = '1974486773200732'; // Your App ID
            const configId = '3264779080399297'; // Your Configuration ID
            const redirectUri = 'https://yuonne-curatorial-marlena.ngrok-free.dev/'; // Matches Valid OAuth Redirect URIs

            // Build the OAuth URL manually to lock down the redirect_uri
            const oauthUrl = `https://www.facebook.com/v21.0/dialog/oauth?` +
                `client_id=${appId}` +
                `&redirect_uri=${encodeURIComponent(redirectUri)}` +
                `&response_type=code` +
                `&config_id=${configId}` +
                `&scope=whatsapp_business_management,whatsapp_business_messaging` +
                `&override_default_response_type=true`;

            // Open popup window
            const popup = window.open(oauthUrl, 'WhatsAppSignup', 'width=600,height=700');

            // Check periodically for popup closing or query parameter completion
            const checkPopup = setInterval(() => {
                if (!popup || popup.closed) {
                    clearInterval(checkPopup);
                }

                try {
                    // Check if popup returned to our redirect URI with code
                    if (popup.location.href.includes('code=')) {
                        const urlParams = new URLSearchParams(popup.location.search);
                        const authCode = urlParams.get('code');
                        popup.close();
                        clearInterval(checkPopup);

                        if (authCode) {
                            sendCodeToDjango(authCode, redirectUri);
                        }
                    }
                } catch (e) {
                    // Cross-origin restrictions while popup is on facebook.com (safe to ignore)
                }
            }, 500);
        }

        async function sendCodeToDjango(authCode, redirectUri) {
            try {
                const csrfMeta = document.querySelector('meta[name="csrf-token"]');
                const csrfToken = csrfMeta ? csrfMeta.getAttribute('content') : '';

                const resp = await fetch('/account/api/whatsapp/exchange-code/', {
                    method: 'POST',
                    headers: {
                        'X-CSRFToken': csrfToken,
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ 
                        code: authCode,
                        redirect_uri: redirectUri,
                        waba_id: capturedWabaId
                    })
                });

                const data = await resp.json();
                console.log('✅ Access Token & WABA Data:', data);
            } catch (error) {
                console.error('❌ Error exchanging code:', error);
            }
        }
    </script>

    <script>
        async function sendWhatsAppMessage(recipientPhoneNumber, message, imageFile=null) {

            const formDate = new FormData()
            formDate.append('phone_number', recipientPhoneNumber)
            formDate.append('message', message)
            if(imageFile){
                formDate.append('image', imageFile)
            }
            
            try{
                const response = await fetch('/account/api/whatsapp/send-message/', {
                    method: 'POST',
                    headers: {
                        'X-CSRFToken': document.querySelector('meta[name="csrf-token"]').getAttribute('content'),
                    },
                    body: formDate
                })

                const data = await response.json()

                if (!response.ok){
                    throw new Error(data.detail)
                }
            } catch(error){
                console.error(error)
            }
        }

        const sendButton = document.getElementById("send_whatsapp")

        sendButton.addEventListener("click", async(e)=>{
            e.preventDefault()

            const phoneNumber = document.getElementById("phone_number").value
            const message = document.getElementById("message").value
            const imageFile = document.getElementById("image").files[0] || null

            console.log("Image file:", imageFile)

            if(phoneNumber && message){
                await sendWhatsAppMessage(phoneNumber, message, imageFile)
            } else{
                alert("Both phone number and message are required.")
            }
        })

        async function logOutUser() {

            const refreshToken = localStorage.getItem('refresh_token')

            if(!refreshToken){
                console.warn('No refresh token available, user already logged out')
                return;
            }

            try{
                const response = await fetch('/account/api/logout/', {
                    method: 'POST',
                    headers: {
                        'X-CSRFToken': document.querySelector('meta[name="csrf-token"]').getAttribute('content'),
                        'Content-Type': 'application/json',
                    },
                    credentials: 'include',
                    body: JSON.stringify({refresh_token: refreshToken})
                })

                const data = await response.json()

                if (response.ok){
                    localStorage.removeItem('access_token')
                    localStorage.removeItem('refresh_token')

                    alert('Logout Successfully')

                    window.location.href = '/account/login/'
                } else{
                    console.log(data.detail)
                }
            } catch(error){
                console.error(Error)
            }
        }

        async function createProduct(formData) {
            const url = '/account/api/products/'; // Adjust path to match your Django URL routing

            try {
                const response = await fetch(url, {
                    method: 'POST',
                    headers: {
                        'X-CSRFToken': document.querySelector('meta[name="csrf-token"]').getAttribute('content'),
                        // Note: Do NOT set 'Content-Type' when sending FormData.
                        // The browser automatically sets boundary headers for multipart/form-data.
                    },
                    body: formData
                });

                const data = await response.json();

                if (!response.ok) {
                    throw new Error(JSON.stringify(data));
                }

                console.log(data)

                return { success: true, data };
            } catch (error) {
                console.error('Error creating product:', error);
                return { success: false, error: error.message };
            }
        }

        async function syncProductsToMetaCatalog(productIds = []) {
            const url = '/account/api/catalog/sync/';

            try {
                const response = await fetch(url, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'X-CSRFToken': document.querySelector('meta[name="csrf-token"]').getAttribute('content'),
                    },
                    body: JSON.stringify({ product_ids: productIds })
                });

                const data = await response.json();

                if (!response.ok) {
                    throw new Error(data.detail || 'Catalog sync failed.');
                }

                return { success: true, data };
            } catch (error) {
                console.error('Error syncing catalog:', error);
                return { success: false, error: error.message };
            }
        }


        // main.js

        document.getElementById('productForm').addEventListener('submit', async function(e) {
            e.preventDefault();

            const submitBtn = document.getElementById('submitBtn');
            const btnText = document.getElementById('btnText');
            const btnSpinner = document.getElementById('btnSpinner');
            const alertMsg = document.getElementById('alertMessage');

            // UI Loading State
            submitBtn.disabled = true;
            btnSpinner.classList.remove('d-none');
            btnText.textContent = 'Saving Product...';
            alertMsg.classList.add('d-none');

            // 1. Build FormData Payload
            const formData = new FormData();
            formData.append('name', document.getElementById('name').value);
            formData.append('seller', document.getElementById('seller').value);
            formData.append('description', document.getElementById('description').value);
            formData.append('price', document.getElementById('price').value);
            formData.append('currency', document.getElementById('currency').value);
            formData.append('availability', document.getElementById('availability').value);
            formData.append('condition', document.getElementById('condition').value);

            // Primary image file
            const primaryImageInput = document.getElementById('image-');
            console.log(primaryImageInput)
            if (!primaryImageInput.files || primaryImageInput.files.length === 0) {
                // Stop the submission early and alert the user
                btnSpinner.classList.add('d-none');
                btnText.textContent = 'Save & Upload Product';
                submitBtn.disabled = false;

                alertMsg.className = 'alert alert-danger mt-3';
                alertMsg.textContent = 'Please select a primary product image file before submitting.';
                alertMsg.classList.remove('d-none');
                return;
            }

            // Append primary image
            formData.append('image', primaryImageInput.files[0]);

            // Additional gallery images
            const galleryInput = document.getElementById('additional_images');
            for (let i = 0; i < galleryInput.files.length; i++) {
                formData.append('additional_images', galleryInput.files[i]);
            }

            // 2. Call Product Creation API
            const createResult = await createProduct(formData);

            if (!createResult.success) {
                // Handle Error State
                btnSpinner.classList.add('d-none');
                btnText.textContent = 'Save & Upload Product';
                submitBtn.disabled = false;

                alertMsg.className = 'alert alert-danger mt-3';
                alertMsg.textContent = `Product Save Failed: ${createResult.error}`;
                alertMsg.classList.remove('d-none');
                return;
            }

            // 3. Trigger Meta Catalog Sync for the Created Product
            const newProduct = createResult.data;
            btnText.textContent = 'Syncing to Meta Catalog...';

            const syncResult = await syncProductsToMetaCatalog([newProduct.id]);

            // Reset UI State
            btnSpinner.classList.add('d-none');
            btnText.textContent = 'Save & Upload Product';
            submitBtn.disabled = false;

            if (syncResult.success) {
                alertMsg.className = 'alert alert-success mt-3';
                alertMsg.textContent = `🎉 Success! Product created and catalog synced to Meta! (Catalog ID: ${syncResult.data.catalog_id})`;
                document.getElementById('productForm').reset();
            } else {
                alertMsg.className = 'alert alert-warning mt-3';
                alertMsg.textContent = `Product saved locally, but Meta sync failed: ${syncResult.error}`;
            }

            alertMsg.classList.remove('d-none');
        });
    </script>
</body>
</html>
