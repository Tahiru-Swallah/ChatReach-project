<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="csrf-token" content="{{ csrf_token }}">
    <title>Document</title>
</head>
<body>
    <form id="schedule_form" enctype="multipart/form-data">
        <textarea id="message" placeholder="Type message..." required></textarea><br>
        <input type="datetime-local" id="scheduled_time" required><br>
        <input type="file" id="media"><br>

        <div class="contact-list">

        </div>

        <button type="submit">Schedule Message</button>

        <hr>

        <h2>Scheduled Messages</h2>
        <div id="scheduled-messages"></div>
    </form>


    <script>

        document.addEventListener('DOMContentLoaded', async (e) => {
            await loadContacts()
            await loadScheduledMessages()
        })
        async function loadContacts(){
            try{
                const response = await fetch('/api/contacts/')

                const contacts = await response.json()

                const contactList = document.querySelector('.contact-list')
                contactList.innerHTML = ''

                contacts.forEach(contact => {
                    const label = document.createElement('label')
                    label.innerHTML = `
                        <input type="checkbox" name="contacts" value="${contact.id}">
                        ${contact.name} - ${contact.phone_number}
                    `
                    contactList.appendChild(label)
                    contactList.append(document.createElement('br'))
                })
            
            } catch(error){
                console.error(error)
            } 
        } 

        const form = document.getElementById('schedule_form')

        form.addEventListener('submit', async (e) => {
            e.preventDefault()

            const message = document.getElementById('message').value
            const scheduledTime = document.getElementById('scheduled_time').value
            const mediaFile = document.getElementById('media').files[0]
            const contactCheckBoxes = document.querySelectorAll('input[name="contacts"]:checked')

            const contactIDs = Array.from(contactCheckBoxes).map(cb => cb.value)

            if (contactIDs.length === 0){
                alert('Please select at least one contact.')
                return
            }

            const formData = new FormData()
            formData.append('message', message)
            formData.append('scheduled_time', scheduledTime)
            contactIDs.forEach(id => {
                formData.append('contacts', id)
            })
            if(mediaFile){
                formData.append('media', mediaFile)
            }

            try{

                const response = await fetch('/api/schedule/message/create/', {
                    method: 'POST',
                    headers: {
                        'x-CSRFToken': document.querySelector('meta[name="csrf-token"]').getAttribute('content')
                    },
                    body: formData
                })

                const data = await response.json()

                if (response.ok){
                    alert('Message scheduled successfully ✅')
                    console.log('Scheduled:', data)
                    form.reset()
                } else{
                    alert('Scheduling failed ❌')
                    console.error('Error:', data)
                } 

            } catch(error){
                console.error(error)
            }
        })  

        async function loadScheduledMessages(){
            try{
                const response = await fetch('/api/schedule/messages/')

                const messages = await response.json()
                console.log(messages)

                const messageCard = document.getElementById('scheduled-messages')
                messageCard.innerHTML = ''

                messages.forEach(msg => {
                    const scheduledFor = new Date(msg.scheduled_time);

                    // Get day of the week (e.g., Monday)
                    const weekday = scheduledFor.toLocaleDateString('en-US', { weekday: 'long' });

                    // Format full date with 12-hour time and AM/PM
                    const formattedDate = scheduledFor.toLocaleString('en-US', {
                        hour: 'numeric',
                        minute: 'numeric',
                        hour12: true,
                        year: 'numeric',
                        month: 'long',
                        day: 'numeric',
                    });
                    
                    const li = document.createElement('li')
                    li.innerHTML = `
                        <strong>Message: <strong/>${msg.message} <br>
                        <strong>Schedule Time: <strong/>${weekday}, ${formattedDate}<br>
                        <strong>Status: <strong/>${msg.status} <br>
                        <strong>Time created: <strong/>${new Date(msg.created_at).toLocaleString('en-US', {
                            hour: 'numeric',
                            minute: 'numeric',
                            hour12: true,
                            year: 'numeric',
                            month: 'long',
                            day: 'numeric',
                        })}<br> 
                        
                        <button onclick="deleteScheduleMessage('${msg.id}')">Delete Message</button>
                        <hr>`

                    messageCard.append(li)
                })

            } catch(error){
                console.error(error)
            }
        }

        async function deleteScheduleMessage(messageId){
            try{
                const response = await fetch(`/api/schedule/${messageId}/delete/`, {
                    method: 'DELETE',
                    headers: {
                        'X-CSRFToken': document.querySelector('meta[name="csrf-token"]').getAttribute('content')
                    }
                })

                if (response.status === 204){
                    alert('Message delete successfully')
                    window.location.reload()
                } else{
                    const data = await response.json();
                    alert(`Error: ${data.error || 'Something went wrong'}`);
                }
            } catch(error){
                console.error(error)
            }
        }
    </script>
</body>
</html>
